name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build (real next build — same gate as Vercel)
        run: npx next build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_key
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          NEXT_PUBLIC_APP_URL: https://clipwise.ca
          RESEND_API_KEY: re_dummy_key
          TWILIO_ACCOUNT_SID: ACdummydummydummydummydummydummy00
          TWILIO_AUTH_TOKEN: dummy_twilio_token
          TWILIO_PHONE_NUMBER: "+15555550100"
          CRON_SECRET: dummy_cron
