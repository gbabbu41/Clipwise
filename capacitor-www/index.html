<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>ClipWise</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
      }
      .dot {
        width: 36px;
        height: 36px;
        border: 3px solid #1e1e1e;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        color: #888;
        font-size: 14px;
        max-width: 260px;
        line-height: 1.5;
      }
      b {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!--
      Fallback only. With `server.url` set in capacitor.config.ts the app loads
      the live clipwise.ca site; this screen shows briefly on launch or if the
      device is offline.
    -->
    <div class="wrap">
      <div class="dot"></div>
      <p><b>ClipWise</b><br />Connecting… check your internet if this stays up.</p>
    </div>
  </body>
</html>
